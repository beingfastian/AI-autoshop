name: CI

on:
  push:
    branches: [main, Architectures]
  pull_request:

# Least privilege: CI only needs to read the repo
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both ways of configuring the database must keep working
        db-config: [db-vars, database-url]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DB_NAME: ai_receptionist_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            agent/package-lock.json
            web/package-lock.json

      - name: Configure database via DB_* variables
        if: matrix.db-config == 'db-vars'
        run: |
          echo "DB_HOST=localhost" >> "$GITHUB_ENV"
          echo "DB_PORT=5432" >> "$GITHUB_ENV"
          echo "DB_USER=postgres" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=postgres" >> "$GITHUB_ENV"

      - name: Configure database via DATABASE_URL only
        if: matrix.db-config == 'database-url'
        run: echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/ai_receptionist" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix agent
          npm ci --prefix web

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Dashboard type-check and build
        run: |
          npm --prefix web run typecheck
          npm --prefix web run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

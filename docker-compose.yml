# Local infrastructure. Postgres is exposed on 5433 so it can run alongside a native install on 5432;
# set DB_PORT=5433 (and DB_USER/DB_PASSWORD below) in your .env files to use it.
# Redis is not used yet; it is here for the job queue planned in Phase 1.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_receptionist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
